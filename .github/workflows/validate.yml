name: validate-screenshots

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r validator/requirements.txt
      - name: Validate screenshots
        run: python validator/validate.py
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "mathiasz-validator"
          git config user.email "mathiasz-validator@users.noreply.github.com"
          git add data.json validator/validation.json
          git diff --cached --quiet || git commit -m "validation update $(date -u +%FT%TZ)" && git push
